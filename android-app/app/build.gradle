plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.garhy.gtbybit'
    compileSdk 35

    defaultConfig {
        applicationId 'tech.garhy.gtbybit'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}
